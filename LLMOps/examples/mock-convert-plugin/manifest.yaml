# mock-convert-plugin — 양자화·포팅(SP-4 / v0.4 3.9) convert 컨테이너 mock manifest.
# 플랫폼 소유 llama.cpp convert 컨테이너의 mock. 실제 변환 이미지 도착 전 플랫폼 측
# convert job 와이어링(학습 후 양자화→포팅 패키지 다운로드) 검증용. 계약 전문:
# ../hello-plugin/external-container-spec.md
apiVersion: tango.acryl.ai/v1
kind: ExternalContainer

metadata:
  name: mock-convert
  version: "1.0.0"
  vendor: "Acryl (scaffold)"
  contact: "platform@acryl.ai"
  description: |
    양자화·포팅(SP-4 / v0.4 3.9) convert 컨테이너 mock. merged 모델(/model)을 받아
    /output 에 포팅 패키지(model.gguf + inference.py + run.sh + config.json +
    metadata.json)를 고정 생성. 실제 llama.cpp(convert_hf_to_gguf + quantize)
    이미지 도착 시 동일 계약으로 교체.

spec:
  image: "docker.io/acrylaaai/mock-convert-plugin:1.0.0"

  job_type: convert               # ← convert 슬롯(기존 enum 예약). 학습 후 1회성 변환.
  # async: HTTP 서버(/run+poll) 기반 — generate 와 동일·검증된 와이어링.
  # (batch 는 HTTP 서버 없는 run-and-exit 계약이라 본 mock 구조와 불일치)
  execution_mode: async
  port: 8000

  resources:
    cpu: "1"
    memory: "512Mi"
    gpu: 0                         # llama.cpp 변환은 CPU 중심. mock 은 GPU 불필요.

  inputs:
    params:
      required: false             # target_quant(q4/q5/q6) / model_name (기본값 있음)
    dataset:
      required: false             # 입력은 merged 모델(/model) — dataset 아님

  outputs:
    metrics: true                 # /output/metadata.json
    artifacts: true               # /output 포팅 패키지(gguf + inference.py + run.sh + config.json)

  secrets:
    required: []

  network:
    egress_whitelist: []

  endpoints:
    info: "/info"
    health: "/health"
    live: "/live"
    run: "/run"
    jobs: "/jobs/{id}"
    cancel: "/jobs/{id}/cancel"

  capabilities:
    estimated_startup_seconds: 10
    estimated_duration_seconds: 40
    timeout_seconds: 1800

  workspace_scope: per-workspace
