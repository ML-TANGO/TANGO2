model: google/gemma-4-E4B-it
data_path: data/logickor_sft_high_converted.jsonl
max_seq_length: 2048

lora:
  r: 32
  alpha: 64
  dropout: 0.05
  # Gemma4 is multimodal. Restrict LoRA to the text language_model so
  # matching q_proj/k_proj/v_proj names in vision_tower or audio_tower are
  # not adapted during text-only SFT.
  # Gemma4 layers 24-41 are KV-shared and do not have checkpointed k_proj/v_proj/k_norm.
  # Apply LoRA to q/k/v/o on layers 0-23, q/o on layers 24-41, and MLP on all layers.
  target_modules_regex: ".*language_model\\.layers\\.((([0-9]|1[0-9]|2[0-3])\\.self_attn\\.(q_proj|k_proj|v_proj|o_proj))|(([0-9]|[1-3][0-9]|4[0-1])\\.self_attn\\.(q_proj|o_proj))|(([0-9]|[1-3][0-9]|4[0-1])\\.mlp\\.(gate_proj|up_proj|down_proj)))$"

split:
  train_ratio: 0.9

training:
  cuda_visible_devices: "2"
  num_train_epochs: 200
  learning_rate: 5.0e-5
  lr_scheduler_type: cosine
  warmup_ratio: 0.03
  optim: adamw_torch
  weight_decay: 0.0
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 16
  gradient_checkpointing: true
  logging_steps: 10
  eval_steps: 20
  # 체크포인트 저장 시 
  # save_checkpoints: true
  # save_steps: 20
  # save_total_limit: 1
  # load_best_model_at_end: true
  # best_checkpoint_only: true
  # bf16: true
  # fp16: false
  # assistant_only_loss: true
  # completion_only_loss: false

  # 체크포인트 저장 안할 시 
  save_checkpoints: false
  save_steps: 0
  save_total_limit: 0
  load_best_model_at_end: false
  best_checkpoint_only: false
  bf16: true
  fp16: false
  assistant_only_loss: true
  completion_only_loss: false

early_stopping:
  enabled: false
  patience: 3
  threshold: 0.0
