apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.global.jfb.name.synthesis }}
  namespace: {{ .Values.global.jfb.namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Values.global.jfb.name.synthesis}}
  template:
    metadata:
      labels:
        app: {{ .Values.global.jfb.name.synthesis }}
        {{- include "lib.label.jfb" . | nindent 8 }}
      annotations:
        "acryl.ai/appType": system
        checksum/config: {{ include "lib.lookup.settings" . }}
    spec:
      serviceAccountName: jfb-synthesis-sa
      nodeSelector:
      {{- include "lib.nodeSelector.manage" . | nindent 8 }}
      initContainers:
      {{- include "lib.initContainer.db" . | nindent 6}}
      {{- if .Values.global.jfb.image.pullSecrets.enabled }}
      imagePullSecrets:
      - name: {{ .Values.global.jfb.image.pullSecrets.name }}
      {{- end }}
      containers:
      - name: {{ .Values.global.jfb.name.synthesis }}
        image: {{ .Values.global.jfb.image.system.registry }}/{{ .Values.global.jfb.image.synthesis }}
        # 로컬 태그 이미지(analyzing 런타임 재사용, 코드는 NFS 마운트) — global Always 면
        # ImagePullBackOff 라 IfNotPresent 하드코딩(external_container 선례). 정식 빌드 후 교체.
        imagePullPolicy: IfNotPresent
        command: [ "/bin/bash", "-c"]
        args: ["cd /app; ./run.sh; sleep infinity;"]
        resources:
          limits:
            cpu : 0.5
            memory : "512M"
          requests:
            cpu : 0.2
            memory : "256M"
        ports:
        - containerPort: 8000
        # 인라인 probe — commonlib _probe.tpl 은 per-app 하드코딩이라 synthesis 분기가
        # 없음(external_container 와 동일 처리). /api/synthesis/healthz 직접 사용.
        readinessProbe:
          httpGet:
            path: /api/synthesis/healthz
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /api/synthesis/healthz
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 3
          failureThreshold: 3
        env:
        - name: JF_SYNTHESIS_APP_IMAGE
          value: {{ .Values.global.jfb.image.synthesis }}
        envFrom:
        - configMapRef:
            name: jfb-settings
        volumeMounts:
        {{- include "lib.volume.volumeMounts.storage" . | nindent 8 }}
        {{- include "lib.volume.volumeMounts" (dict "name" "jf-kube" )  | nindent 8 }}
        {{- include "lib.volume.volumeMounts" (dict "name" "jf-src" "enabled" .Values.global.jfb.volume.src.enabled ) | nindent 8 }}
      volumes:
      {{- include "lib.volume.claim.storage" . | nindent 6  }}
      {{- include "lib.volume.claim" (dict "name" "jf-kube")  | nindent 6 }}
      {{- include "lib.volume.claim" (dict "name" "jf-src" "app" "synthesis" "enabled" .Values.global.jfb.volume.src.enabled ) | nindent 6 }}
