apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.global.jfb.namespace }}-clusteradmin-scheduler

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Values.global.jfb.namespace }}-clusteradmin-cluster-role-scheduler
  annotations:
    rbac.authorization.kubernetes.io/autoupdate: "true"
  labels:
    kubernetes.io/bootstrapping: rbac-defaults
rules:
- apiGroups: [""]
  resources: ["*"]
  verbs: ["*"]
- apiGroups: [""]
  resources: ["PersistentVolumes", "PersistentVolumeClaims","PersistentVolumeClaims/status","nodes"]
  verbs: ["*"]
- apiGroups: ["storage.k8s.io"]
  resources: ["*"]
  verbs: ["*"]
- apiGroups: ["rbac.authorization.k8s.io"]
  resources: ["*"]
  verbs: ["*"]
- apiGroups: ["apps"]
  resources: ["deployments"]
  verbs: ["*"]
- apiGroups: [""]
  resources: ["services"]
  verbs: ["*"]
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["*"]
- apiGroups: ["extensions", "networking.k8s.io"]
  # networkpolicies — 외부컨테이너 잡 차트(helm_chart/external_container)가 network.isolate
  # 매니페스트에 NetworkPolicy 를 렌더한다. 없으면 helm install 이 forbidden 으로 실패한다.
  resources: ["ingresses", "networkpolicies"]
  verbs: ["*"]
- apiGroups: [""]
  resources: ["namespaces"]
  verbs: ["*"]
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["*"]
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["*"]
- apiGroups: ["batch"]
  resources: ["jobs"]
  verbs: ["*"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Values.global.jfb.namespace }}-clusteradmin-cluster-role-binding-scheduler
subjects:
- kind: ServiceAccount
  name: {{ .Values.global.jfb.namespace }}-clusteradmin-scheduler
  namespace: {{ .Values.global.jfb.namespace }}
roleRef:
  kind: ClusterRole
  name: {{ .Values.global.jfb.namespace }}-clusteradmin-cluster-role-scheduler
  apiGroup: rbac.authorization.k8s.io
