apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  generation: 1
  name: {{ .Values.global.jfb.name.marker_back }}-api
  namespace: {{ .Values.global.jfb.namespace }}
spec:
  ingressClassName: {{ .Values.global.jfb.settings.external.ingressClassName }}
  rules:
  - http:
      paths:
      - backend:
          service:
            name: {{ .Values.global.jfb.name.marker_back }}-svc
            port:
              number: 80
        path: /marker/api/
        pathType: Prefix
      - backend:
          service:
            name: {{ .Values.global.jfb.name.marker_back }}-svc
            port:
              number: 90
        path: /marker/images/
        pathType: Prefix
      - backend:
          service:
            name: {{ .Values.global.jfb.name.marker_back }}-svc
            port:
              number: 90
        path: /marker/exports/
        pathType: Prefix
      - backend:
          service:
            name: {{ .Values.global.jfb.name.marker_back }}-svc
            port:
              number: 90
        path: /marker/guides/
        pathType: Prefix
      - backend:
          service:
            name: {{ .Values.global.jfb.name.marker_back }}-svc
            port:
              number: 90
        path: /marker/thumbnails/
        pathType: Prefix
      - backend:
          service:
            name: {{ .Values.global.jfb.name.marker_back }}-svc
            port:
              number: 90
        path: /marker/pdf/
        pathType: Prefix