apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.global.jfb.name.marker_back }}-svc
  namespace: {{ .Values.global.jfb.namespace }}
spec:
  selector:
    app: {{ .Values.global.jfb.name.marker_back }}
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 9123
    - name: metrics
      protocol: TCP
      port: 90
      targetPort: 9000
