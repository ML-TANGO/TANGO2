apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.global.jfb.name.model }}
  namespace: {{ .Values.global.jfb.namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Values.global.jfb.name.model }}
  template:
    metadata:
      labels:
        app: {{ .Values.global.jfb.name.model }}
        {{- include "lib.label.jfb" . | nindent 8 }}
      annotations:
        "acryl.ai/appType": system
        checksum/config: {{ include "lib.lookup.settings" . }}
    spec:
      serviceAccountName: jfb-model-sa
      containers:
      - name: {{ .Values.global.jfb.name.model }}
        image:  {{ .Values.global.jfb.image.system.registry }}/{{ .Values.global.jfb.image.model }}
        imagePullPolicy: {{ .Values.global.jfb.image.pullPolicy }}
        command: [ "/bin/bash", "-c",]
        args: ["cd /app; ./run.sh; sleep infinity;"]
        {{- include "lib.probe.readiness" (dict "app" "model" )  | nindent 8 }}
        {{- include "lib.probe.liveness" (dict "app" "model" )  | nindent 8 }}
        resources:
          limits:
            cpu : 0.5
            memory : "256M"
          requests:
            cpu : 0.1
            memory : "128M"
        ports:
        - containerPort: 8000
        envFrom:
        - configMapRef:
            name: jfb-settings
        env:
        # 양자화(convert) 컨테이너 manifest 바인딩 — 레지스트리 등록명(convert-llamacpp).
        # jfb-settings 에 키가 없어 코드 기본값 mock-convert 로 떨어지므로 여기서 명시 오버라이드.
        - name: CONVERT_MANIFEST_NAME
          value: "convert-llamacpp"
        - name: CONVERT_MANIFEST_VERSION
          value: "1.1.0"
        # SDS(3.5) 도메인 모델 생성 시 바인딩되는 학습 manifest — 같은 이유로
        # jfb-settings 에 키가 없어 코드 기본값에 의존하게 되는 값이라 여기서 고정.
        # recipe 를 가진 판본이어야 FT 탭이 레시피 파이프라인으로 렌더된다.
        # 기본값 1.1.0 = fb_external_container 가 부팅 시 시드하는 표준 판본이라
        # 신규 설치에서 항상 존재한다. 내부 패치 이미지를 쓰는 인스턴스는
        # values 의 global.jfb.sds_manifest_version 으로 그 버전을 지정한다 —
        # 하드코딩하면 그런 인스턴스의 수동 env 가 upgrade 때 덮여 FT 탭이
        # 레시피 없는 화면으로 되돌아간다.
        - name: SDS_MANIFEST_NAME
          value: "eva-vlm-train"
        - name: SDS_MANIFEST_VERSION
          value: "{{ .Values.global.jfb.sds_manifest_version | default "1.1.0" }}"
        volumeMounts:
        {{- include "lib.volume.volumeMounts" (dict "name" "jf-kube" )  | nindent 8 }}
        {{- include "lib.volume.volumeMounts"  (dict "name" "jf-src" "enabled" .Values.global.jfb.volume.src.enabled )  | nindent 8 }}
        {{- include "lib.volume.volumeMounts.storage" . | nindent 8 }}
      volumes:
      {{- include "lib.volume.claim" (dict "name" "jf-kube")  | nindent 6 }}
      {{- include "lib.volume.claim"  (dict "name" "jf-src" "app" "model" "enabled" .Values.global.jfb.volume.src.enabled )  | nindent 6 }}
      {{- include "lib.volume.claim.storage" . | nindent 6  }}
