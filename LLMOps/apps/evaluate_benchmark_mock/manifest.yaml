# evaluate-benchmark-mock — 벤치마크 평가 mock 컨테이너 (llm_evaluation P1a).
# 정식 벤치마크 컨테이너(고려대 plugin / 실측) 탑재 전, 오케스트레이션+FE e2e 테스트용.
# 17 메트릭에 결정적 mock 점수 반환. SP-1 계약(apps/evaluate 동형) → 런치 와이어링 무변경.
# 계약 전문: ../../examples/hello-plugin/external-container-spec.md
apiVersion: tango.acryl.ai/v1
kind: ExternalContainer

metadata:
  name: evaluate-benchmark-mock
  version: "0.1.0"
  vendor: "Acryl (platform-owned, mock)"
  contact: "platform@acryl.ai"
  description: |
    벤치마크 평가 MOCK 컨테이너. 모델을 실제로 돌리지 않고 17개 벤치마크 메트릭
    (accuracy/f1/mmlu/.../bleu/rouge)에 대해 결정적(hash 기반) 점수를 반환한다.
    오케스트레이션(llm_evaluation)+FE e2e 검증 목적. 정식 메트릭은 apps/evaluate
    (실측 기본) / 고려대 plugin(정밀)로 라우팅하며 manifest 교체로 대체.

spec:
  image: "docker.io/acrylaaai/evaluate-benchmark-mock:0.1.0"

  job_type: evaluate
  execution_mode: async
  port: 8000

  resources:
    cpu: "1"
    memory: "512Mi"           # 모델 로드 없음(mock) — 경량.
    gpu: 0

  inputs:
    params:
      required: false         # metric_set / datasets
    dataset:
      required: true          # evaluate 계약상 필수(validator 강제). mock 은 마운트만 받고 내용 미열람.

  outputs:
    metrics: true             # /output/metrics.json
    artifacts: false

  secrets:
    required: []

  network:
    egress_whitelist: []

  endpoints:
    info: "/info"
    health: "/health"
    live: "/live"
    run: "/run"
    jobs: "/jobs/{id}"
    cancel: "/jobs/{id}/cancel"

  capabilities:
    estimated_startup_seconds: 5
    estimated_duration_seconds: 10
    timeout_seconds: 300

  workspace_scope: per-workspace
