# yarn 4(berry) 설정. 사내망/폐쇄망에서 install 이 통과하도록 완화한 항목들이다.

# git 소스 의존성 승인 — 현재 실제 사용처는 yarn.lock 의 file-saver(github:eligrey/FileSaver.js).
approvedGitRepositories:
  - "**"

# ⚠️ postinstall 스크립트 실행 게이트는 **이것 하나뿐**이다(전역 on/off).
#   yarn 4 코어에는 패키지별 허용목록이 없다 — package.json 에 allowScripts 를 적어도
#   plugins 로 해석 주체를 등록하지 않으면 no-op 이라 "허용목록이 있다"는 착시만 준다
#   (그래서 그 필드는 제거했다). 여기서 true 인 동안 새 의존성의 postinstall 도 무조건 실행된다.
enableScripts: true

nodeLinker: node-modules

npmMinimalAgeGate: 0
