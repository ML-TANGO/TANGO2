apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.name }}--service
  namespace: {{ .Values.namespace }}
  labels:
    app: {{ .Values.name }}
    jfb-type: remote-api-proxy
spec:
  type: ClusterIP
  selector:
    app: {{ .Values.name }}
  ports:
    - port: {{ .Values.port }}
      targetPort: {{ .Values.port }}
      protocol: TCP
