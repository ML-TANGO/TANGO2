# ─────────────────────────────────────────────────────────────────────────────
# evaluate-selfmetric.yaml — 부팅 시드 manifest (자동 평가 self-metric, async)
#
# ⚠️ 정본은 컨테이너 소스 옆의 `apps/evaluate/manifest.yaml` 이다. 이 파일은 부팅 자동 등록
# (src/manifest/seed.py)을 위한 **사본**이라, 한쪽을 고치면 반드시 다른 쪽도 맞춰야
# 한다(이미지 태그·버전이 특히 그렇다).
# 사본을 두는 이유: 시드 디렉터리는 이미지에 COPY 되고 NFS src 마운트로도 잡히는데,
# 리포 루트 밖을 가리키는 심링크는 이미지 빌드에서 깨진다.
#
# service_family 가 없으므로 페어가 아니라 단건으로 등록된다(짝 컨테이너 없음).
# 플랫폼 바인딩은 settings 의 EVALUATE_MANIFEST_NAME/VERSION 이 해석한다
# (기본값 evaluate-selfmetric / 1.0.0 — 아래 metadata 와 일치해야 한다).
#
# 이 파일이 없으면: 레지스트리 등록은 런타임 POST /api/v1/manifests 뿐이라, 신규
# 설치 인스턴스는 이 컨테이너가 미등록 상태로 뜨고 해당 평가 경로가 조용히 막힌다
# (dev 의 evaluate 행들은 과거에 손으로 POST 한 것이다).
#
# 상태(2026-09-11 실측): dev 레지스트리에 이 이름이 **0건**이었다. evaluate 16 행이
# 전부 logickor/judge/intent/benchmark-mock 이고 self-metric 은 한 번도 등록된 적이
# 없어서, EVALUATE_MANIFEST 바인딩이 해석 실패하는 상태였다. 이 시드가 그걸 메운다.
# 이미지 docker.io/acrylaaai/evaluate-selfmetric:1.0.0 은 Hub 에 실재한다(pull 가능).
# ─────────────────────────────────────────────────────────────────────────────

# evaluate-selfmetric — 플랫폼 소유 자동평가 컨테이너 (SP-5 / v0.4 3.8).
# 외부 SaaS judge 비의존 자체 메트릭(BLEU/ROUGE/perplexity). 동시에 ⑪ 고려대
# 평가 plugin 슬롯의 참조 구현(같은 job_type=evaluate 계약). 플랫폼 소유·구현,
# 배포는 external_container launch 재사용. 계약 전문:
# ../../examples/hello-plugin/external-container-spec.md
apiVersion: tango.acryl.ai/v1
kind: ExternalContainer

metadata:
  name: evaluate-selfmetric
  version: "1.0.0"
  vendor: "Acryl (platform-owned)"
  contact: "platform@acryl.ai"
  description: |
    플랫폼 소유 자동평가 컨테이너. 학습 완료 모델(/model)을 평가 데이터셋
    (/dataset/<name>)으로 채점한다. prompt+reference 가 있으면 생성→BLEU/ROUGE,
    텍스트가 있으면 perplexity 를 계산해 /output/metrics.json + result 로 보고.
    외부 SaaS judge 비의존(순수 파이썬 + torch). ⑪ 고려대 평가 plugin 참조 구현.

spec:
  image: "docker.io/acrylaaai/evaluate-selfmetric:1.0.0"

  job_type: evaluate
  # async: HTTP 서버(/run + poll) — convert/generate 와 동일·검증된 와이어링.
  execution_mode: async
  port: 8000

  resources:
    cpu: "4"
    memory: "16Gi"            # 모델 로드 + 생성 — 모델 크기에 맞춰 조정.
    gpu: 0                    # 소형 모델은 CPU 로 충분. 대형은 gpu:1 로 상향.

  inputs:
    params:
      required: false         # metric_set / max_samples / max_new_tokens / *_field
    dataset:
      required: true          # 평가 데이터셋 필수(_dataset 예약키로 /dataset/<name> 마운트). validator 가 evaluate=required:true 강제.

  outputs:
    metrics: true             # /output/metrics.json
    artifacts: false

  secrets:
    required: []

  network:
    egress_whitelist: []

  endpoints:
    info: "/info"
    health: "/health"
    live: "/live"
    run: "/run"
    jobs: "/jobs/{id}"
    cancel: "/jobs/{id}/cancel"

  capabilities:
    estimated_startup_seconds: 20
    estimated_duration_seconds: 300
    timeout_seconds: 3600

  workspace_scope: per-workspace
