# 우선순위 선점(Preemption) 시험용 매니페스트 2/2
# 높은 우선순위(critical-service, 10000) pod.
# 노드에 2 core 여유가 없으므로 low-filler 1개가 선점(퇴거)된 뒤 이 pod 가 배치되어야 한다.
apiVersion: v1
kind: Pod
metadata:
  name: high-pod
  namespace: priority-test
spec:
  priorityClassName: critical-service
  nodeSelector:
    kubernetes.io/hostname: ubuntu2204-worker
  containers:
    - name: pause
      image: registry.k8s.io/pause:3.8
      resources:
        requests:
          cpu: "2000m"
