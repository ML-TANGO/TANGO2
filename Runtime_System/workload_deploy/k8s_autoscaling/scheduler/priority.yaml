apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: critical-service # E.g., Main API server
value: 10000
globalDefault: false # Not designated service's value is set to 0
preemptionPolicy: PreemptLowerPriority # Default // Node 자원이 부족하면 낮은 우선순위의 pod를 강제 추출
description: "Super-high priority service"
