{{- if .Values.global.jfb.volume.marker_src.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jf-src-marker-pvc
  namespace: {{ .Values.global.jfb.namespace  }}
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 1G
  storageClassName: ""
---

apiVersion: v1
kind: PersistentVolume
metadata:
  name: jf-{{ .Values.global.jfb.namespace }}-src-marker-pv
spec:
  capacity:
    storage: 1G
  accessModes:
    - ReadWriteMany
  claimRef:
    namespace: {{ .Values.global.jfb.namespace }}
    name: jf-src-marker-pvc
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  {{- $srcMarker := dict -}}
  {{- $_ := set $srcMarker "src" (deepCopy .Values.global.jfb.volume.marker_src) }}
  {{- $_ := set $srcMarker.src "path" .Values.global.jfb.volume.marker_src.path }}
  {{- include "lib.volume.type" $srcMarker.src | nindent 2 }}
---
{{- end }}