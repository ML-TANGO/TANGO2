apiVersion: v1
kind: ServiceAccount
metadata:
  name: jfb-data-pipeline-sa
  namespace: {{ .Values.global.jfb.namespace }}

---
# 최소 권한(least-privilege) — llm_data_pipeline 은 구성·판정·영속화만 하는 BFF.
# 실제 전처리/생성/심사 잡의 K8s 생성은 fb_external_container 에 HTTP 위임하고,
# 자신은 DB(fb_utils.llm_db)+NFS+외부 HTTP 만 쓴다 → 직접 K8s API 호출 없음.
# 따라서 플랫폼 표준 wildcard ClusterRole 대신 네임스페이스 한정 read-only Role 만
# 부여한다(부수적 in-namespace 조회 margin). cluster-scope·rbac mint·secrets·wildcard 없음.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: jfb-data-pipeline-role
  namespace: {{ .Values.global.jfb.namespace }}
rules:
- apiGroups: [""]
  resources: ["pods", "configmaps"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: jfb-data-pipeline-role-binding
  namespace: {{ .Values.global.jfb.namespace }}
subjects:
- kind: ServiceAccount
  name: jfb-data-pipeline-sa
  namespace: {{ .Values.global.jfb.namespace }}
roleRef:
  kind: Role
  name: jfb-data-pipeline-role
  apiGroup: rbac.authorization.k8s.io
